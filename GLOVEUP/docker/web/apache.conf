# ──────────────────────────────────────────────────────────────────
# Host virtual del frontend de GloveUp.
# ──────────────────────────────────────────────────────────────────

<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # AllowOverride All permite que app/public/.htaccess active el
        # front controller y las cabeceras de seguridad.
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # ── Recursos de las páginas clásicas ──────────────────────────
    # Las páginas bajo /legacy piden "../assets/…", que resuelve a
    # /legacy/assets/…  Este alias las envía a la única copia real,
    # así la imagen no duplica los 70 MB de imágenes y vídeos.
    Alias /legacy/assets /var/www/html/assets

    # ── Proxy de la API ───────────────────────────────────────────
    # El navegador habla siempre con este servidor, nunca directamente
    # con Node, así que no hay peticiones cruzadas ni CORS.
    ProxyPreserveHost On
    ProxyPass        /api http://api:3000/api
    ProxyPassReverse /api http://api:3000/api

    # Las imágenes de perfil viajan en base64 dentro del JSON
    LimitRequestBody 104857600

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
